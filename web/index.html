<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts AI Studio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b10; color: #eee; font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h1 span { color: #7cf03c; }
  textarea { width: 100%; min-height: 90px; background: #16161e; color: #eee; border: 1px solid #2a2a35; border-radius: 10px; padding: 12px; font-size: 15px; resize: vertical; }
  .row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  select, input[type=text] { background: #16161e; color: #eee; border: 1px solid #2a2a35; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
  select { flex: 1; }
  label.ck { display: flex; align-items: center; gap: 6px; font-size: 14px; background: #16161e; border: 1px solid #2a2a35; border-radius: 8px; padding: 8px 10px; }
  button { width: 100%; background: #7cf03c; color: #0b0b10; border: 0; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { margin: 14px 0; font-size: 14px; color: #aab; white-space: pre-wrap; }
  video { width: 100%; border-radius: 12px; background: #000; margin-top: 6px; }
  a.dl { display: block; text-align: center; margin-top: 10px; background: #16161e; border: 1px solid #7cf03c; color: #7cf03c; border-radius: 10px; padding: 12px; text-decoration: none; font-weight: 600; }
  .note { font-size: 12px; color: #667; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Shorts <span>AI</span> Studio</h1>
  <textarea id="prompt" placeholder="Describe your short video... (e.g. a young man walks toward the camera, wind in his shirt, cinematic light)"></textarea>
  <div class="row">
    <select id="ratio"><option value="9:16">9:16 Shorts</option><option value="16:9">16:9 Wide</option><option value="1:1">1:1 Square</option></select>
    <select id="seconds"><option value="5">5 sec</option><option value="10" selected>10 sec</option><option value="15">15 sec</option><option value="20">20 sec</option><option value="30">30 sec</option></select>
    <select id="quality"><option value="fast" selected>Fast</option><option value="high">High</option></select>
  </div>
  <div class="row">
    <label class="ck"><input type="checkbox" id="voice" checked> Tamil voice</label>
    <label class="ck"><input type="checkbox" id="subtitles" checked> Subtitles</label>
  </div>
  <div class="row"><input type="password" id="owner" autocomplete="off" placeholder="Owner passcode" style="flex:1"></div>
  <button id="go">Generate video</button>
  <div id="status"></div>
  <div id="out"></div>
  <h2 style="font-size:17px;margin-top:28px">My videos on this device</h2>
  <div id="jobs"></div>
  <div class="note">The job keeps running if you leave. My videos is saved on this device/browser. No guaranteed completion time on free engines.</div>
</main>
<script>
const go = document.getElementById('go'), st = document.getElementById('status'), out = document.getElementById('out'), jobsEl = document.getElementById('jobs');
const RAW = '/api/status/';
const KEY = 'shorts-studio-jobs-v1';
let jobs = [];
try { jobs = JSON.parse(localStorage.getItem(KEY) || '[]').filter(x => typeof x.id === 'string' && /^[a-z0-9]{6,32}$/.test(x.id)); } catch {}
function saveJobs() { localStorage.setItem(KEY, JSON.stringify(jobs.slice(0, 30))); }
function node(tag, text) { const el = document.createElement(tag); el.textContent = text; return el; }
function showVideo(container, url) {
  if (!/^https:\/\/github\.com\/cikpa6701l-cmyk\/shorts-render\/releases\/download\/videos\/job-[a-z0-9]+\.mp4$/.test(url)) return;
  const video = document.createElement('video'); video.controls = true; video.playsInline = true; video.src = url;
  const link = document.createElement('a'); link.className = 'dl'; link.href = url; link.download = ''; link.textContent = 'Download MP4';
  container.append(video, link);
}
function render() {
  jobsEl.replaceChildren();
  for (const j of jobs) {
    const card = node('div',''); card.style.cssText = 'border:1px solid #2a2a35;border-radius:10px;padding:12px;margin:10px 0';
    const label = node('div',j.prompt || 'Video'); label.style.cssText = 'font-size:14px;overflow-wrap:anywhere;margin-bottom:8px';
    const state = node('div',j.status === 'ready' ? 'Ready' : j.status === 'failed' ? 'Failed: '+(j.error || 'Please try again') : 'Rendering...');
    state.style.cssText = 'font-size:13px;color:#aab'; card.append(label,state);
    if (j.status === 'ready' && j.video) showVideo(card,j.video);
    jobsEl.append(card);
  }
}
async function check(id) {
  try {
    const r = await fetch(RAW + id + '?x=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    const j = jobs.find(x => x.id === id); if (!j || !['ready','failed','queued'].includes(d.status)) return;
    j.status = d.status; j.error = String(d.error || '').slice(0, 200); j.video = d.video || '';
    if (d.status === 'ready' || d.status === 'failed') {
      go.disabled = false;
      if (id === jobs[0].id) {
        st.textContent = d.status === 'ready' ? 'Done! Engine: '+(d.engine || '') : 'Failed: '+j.error;
        out.replaceChildren(); if (d.status === 'ready') showVideo(out,j.video);
      }
    }
    saveJobs(); render();
  } catch (e) {}
}
async function checkAll() { for (const j of jobs) if (j.status !== 'ready' && j.status !== 'failed') await check(j.id); }
render(); checkAll(); setInterval(checkAll,8000);
go.onclick = async () => {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) { st.textContent = 'Type a prompt first'; return; }
  go.disabled = true; out.replaceChildren(); st.textContent = 'Starting...';
  try {
    const r = await fetch('/api/generate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      prompt, ratio: ratio.value, seconds: seconds.value, quality: quality.value,
      voice: voice.checked, subtitles: subtitles.checked, owner: owner.value }) });
    const d = await r.json();
    if (!r.ok) { st.textContent = 'Error: ' + (d.error || r.status); go.disabled = false; return; }
    jobs.unshift({id:d.id,prompt,status:'queued',ts:Date.now()}); saveJobs(); render();
    st.textContent = 'Queued. Rendering in the background - you can close this page and return later.';
    go.disabled = false; check(d.id);
  } catch (e) { st.textContent = 'Network error. If submitted, check My videos before retrying.'; go.disabled = false; }
};
</script>
</body>
</html>
