name: test-asset
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'asset file name, e.g. job-livetest1.mp4'
        required: true
      kind:
        description: 'valid or corrupt'
        required: true
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -e
          if [ "$KIND" = "valid" ]; then
            command -v ffmpeg || sudo apt-get install -y -qq ffmpeg
            ffmpeg -y -v error -f lavfi -i testsrc=size=512x912:duration=3:rate=24 -f lavfi -i sine=frequency=440:duration=3 -c:v libx264 -b:v 400k -pix_fmt yuv420p -c:a aac -shortest "$NAME"
          else
            printf 'this is not an mp4 file - corrupt test payload' > "$NAME"
          fi
          ls -la "$NAME"
        env:
          NAME: ${{ inputs.name }}
          KIND: ${{ inputs.kind }}
      - name: upload asset
        run: |
          set -e
          REL=$(curl -sf -H "Authorization: Bearer $GT" https://api.github.com/repos/$REPO/releases/tags/videos | jq -r .id)
          test -n "$REL" && [ "$REL" != "null" ]
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GT" -H "Content-Type: video/mp4" --data-binary @"$NAME" "https://uploads.github.com/repos/$REPO/releases/$REL/assets?name=$NAME")
          echo "upload HTTP $CODE"
          cat /tmp/resp.json | head -c 400
          [ "$CODE" = "201" ]
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NAME: ${{ inputs.name }}
