name: web-safety-tests
on:
  push:
    paths: ['web/**', '.github/workflows/web-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && node tests/safety.test.mjs
